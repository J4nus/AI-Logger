<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Activity Logger - Nastavení</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f5f5f7; margin: 0; padding: 24px; color: #1f2937; }
    h1 { font-size: 22px; margin-bottom: 18px; }
    .section { background: white; border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    label { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 14px; }
    input[type='checkbox'] { width: 18px; height: 18px; }
    textarea { width: 100%; min-height: 100px; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px; font-size: 14px; resize: vertical; }
    button { border: none; border-radius: 10px; background: #3b82f6; color: white; padding: 12px 18px; font-size: 14px; cursor: pointer; }
    button:hover { opacity: 0.95; }
    .help { font-size: 13px; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Nastavení AI Activity Logger</h1>
  <div class="section">
    <label><input type="checkbox" id="enabled" /><span>Zapnout logování AI aktivity</span></label>
    <div class="help">Když je vypnuto, rozšíření bude ignorovat zachycené události.</div>
  </div>
  <div class="section">
    <label for="presets">Připravené dotazy (jeden na řádek, formát: název|dotaz)</label>
    <textarea id="presets" placeholder="Rychlý dotaz|Jaké je počasí?"></textarea>
    <div class="help">Tato nastavení se použijí v popupu pro rychlé vkládání a logování presetů.</div>
  </div>
  <button id="saveButton">Uložit nastavení</button>
  <script src="options.js"></script>
</body>
</html>
